<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖 THE FINAL BEAT</text></svg>">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Space+Mono&display=swap');

        body {
            margin: 0;
            background: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Syncopate', sans-serif;
            color: #fff;
        }

        /* --- STAGE & RINGS --- */
        .stage {
            position: relative;
            width: 600px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 3px solid transparent;
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        #days-ring { width: 500px; height: 500px; border-top-color: #00f2ff; animation: rotate 30s linear infinite; }
        #hours-ring { width: 400px; height: 400px; border-right-color: #00f2ff; animation: rotate 20s linear infinite reverse; }
        #mins-ring { width: 300px; height: 300px; border-bottom-color: #00f2ff; animation: rotate 10s linear infinite; }
        #secs-ring { width: 200px; height: 200px; border-left-color: #fff; animation: rotate 2s linear infinite reverse; }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- HEART & GO --- */
        #heart-container {
            position: absolute;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            animation: heartPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .heart {
            background-color: #ff0055;
            display: inline-block;
            height: 150px;
            position: relative;
            transform: rotate(-45deg);
            width: 150px;
            box-shadow: 0 0 60px #ff0055;
            animation: heartBeat 0.8s infinite;
        }

        .heart:before, .heart:after {
            content: "";
            background-color: #ff0055;
            border-radius: 50%;
            height: 150px;
            position: absolute;
            width: 150px;
        }

        .heart:before { top: -75px; left: 0; }
        .heart:after { left: 75px; top: 0; }

        .go-text {
            position: absolute;
            z-index: 210;
            font-size: 3rem;
            color: white;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        @keyframes heartBeat {
            0% { transform: rotate(-45deg) scale(1); }
            15% { transform: rotate(-45deg) scale(1.25); }
            30% { transform: rotate(-45deg) scale(1); }
        }

        @keyframes heartPop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- BUILDING PAGE OVERLAY --- */
        #building-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            font-family: 'Space Mono', monospace;
        }

        .loader-bar {
            width: 300px;
            height: 4px;
            background: #222;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background: #00f2ff;
            box-shadow: 0 0 15px #00f2ff;
            transition: width 3s linear;
        }

        .data-stream {
            font-size: 10px;
            color: #00f2ff;
            opacity: 0.3;
            position: absolute;
            white-space: nowrap;
            animation: moveStream 2s linear infinite;
        }

        @keyframes moveStream {
            from { transform: translateY(100vh); }
            to { transform: translateY(-100vh); }
        }

        .build-msg {
            letter-spacing: 5px;
            font-size: 0.8rem;
            color: #fff;
            margin-bottom: 10px;
        }

        /* --- TIMER UI --- */
        .time-display { text-align: center; z-index: 100; transition: opacity 0.5s; }
        #countdown-text { font-size: 4rem; font-family: 'Space Mono', monospace; }
        .critical { color: #ff0055 !important; text-shadow: 0 0 40px #ff0055 !important; }
    </style>
</head>
<body>

    <div class="stage" id="main-stage">
        <div class="ring" id="days-ring"></div>
        <div class="ring" id="hours-ring"></div>
        <div class="ring" id="mins-ring"></div>
        <div class="ring" id="secs-ring"></div>

        <div class="time-display" id="timer-ui">
            <span id="countdown-text">00:00:00:00</span>
        </div>

        <div id="heart-container">
            <div class="heart"></div>
            <span class="go-text">GO</span>
        </div>
    </div>

    <div id="building-overlay">
        <div class="build-msg" id="build-status">RECONSTRUCTING PAGE...</div>
        <div class="loader-bar"><div class="loader-progress" id="progress"></div></div>
        <div id="stream-container"></div>
    </div>

    <script>
        // Set target date (currently 10 seconds for testing)
        const targetDate = new Date("Feb 14, 2026 11:00:00").getTime();
        const redirectUrl = "https://krameshsaidev.github.io/valentineday_gift/Cutiee.html";

        function update() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                triggerFinalSequence();
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('countdown-text').innerText = 
                `${d.toString().padStart(2, '0')}:${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

            if (diff < 10000) document.getElementById('countdown-text').classList.add('critical');
        }

        function triggerFinalSequence() {
            clearInterval(timerInterval);
            
            // 1. Collapse everything
            document.getElementById('timer-ui').style.opacity = '0';
            document.querySelectorAll('.ring').forEach(r => {
                r.style.width = '0'; r.style.height = '0'; r.style.opacity = '0';
            });

            // 2. Show Heart & GO
            setTimeout(() => {
                document.getElementById('heart-container').style.display = 'flex';
                
                // 3. Start "Building" slowly after heart beats
                setTimeout(() => {
                    showBuildingOverlay();
                }, 2500);
            }, 500);
        }

        function showBuildingOverlay() {
            const overlay = document.getElementById('building-overlay');
            overlay.style.display = 'flex';
            
            // Generate some random hex data streams
            const streamBox = document.getElementById('stream-container');
            for(let i=0; i<15; i++) {
                const s = document.createElement('div');
                s.className = 'data-stream';
                s.style.left = Math.random() * 100 + 'vw';
                s.style.animationDelay = Math.random() * 2 + 's';
                s.innerText = Math.random().toString(16).toUpperCase().substring(2, 15);
                streamBox.appendChild(s);
            }

            // Fill Progress Bar
            setTimeout(() => {
                document.getElementById('progress').style.width = '100%';
                
                // Change messages during build
                setTimeout(() => { document.getElementById('build-status').innerText = "RENDERING ASSETS..."; }, 1000);
                setTimeout(() => { document.getElementById('build-status').innerText = "SYSTEM READY."; }, 2500);

                // Final Redirect
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 3500);
            }, 100);
        }

        const timerInterval = setInterval(update, 1000);
        update();
    </script>
</body>
</html>
